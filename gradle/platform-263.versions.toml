# Versions of dependencies that differ between supported IntelliJ platforms.
# The catalog is available as `platformLibs` and is selected by `environmentName` property in `settings.gradle.kts`

[versions]
# Must match the JUnit version which ide-starter (`TestFrameworkType.Starter`) depends on for this platform,
# otherwise mixed JUnit artifacts end up on the test runtime classpath of `intellij-plugin:integration-tests`
junit = "6.1.3"

[libraries]
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
